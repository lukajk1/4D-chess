<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Chess</title>
<link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
<main>
  <!-- No page chrome: these live here only until app.js moves them into
       whichever control surface the current variant uses, so the view gets
       the full window height. -->
  <!-- The picker floats over the scene, centred, with no bar behind it. -->
  <div id="variant-dock"><select id="variant" aria-label="Variant"></select></div>
  <!-- Reset waits here until app.js docks it in the current control surface. -->
  <div id="stash" hidden><button id="reset">New game</button></div>

  <div class="layout">
    <section>
      <div class="game-state">
        <span id="turn" class="turn-token white"></span>
        <strong id="status">White to move</strong>
        <span class="spacer" style="margin-left:auto"></span>
        <button id="undo">Undo</button>
      </div>
      <div id="board-area"></div>
    </section>

    <aside>
      <div class="panel">
        <h2>Moves</h2>
        <div class="history-scroll"><ol id="history"></ol></div>
      </div>
      <div class="panel">
        <h2>Position</h2>
        <input id="fen" spellcheck="false" aria-label="Position notation">
        <div class="fen-actions">
          <button id="copy">Copy</button>
          <button id="load">Load</button>
        </div>
        <p class="hint">Shape, then placement. On an 8&times;8 board the placement field is ordinary FEN.</p>
      </div>
    </aside>
  </div>
</main>

<dialog id="promotion">
  <strong>Promote to</strong>
  <div id="promotion-choices"></div>
</dialog>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
